<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="مجموعه‌ی بازی‌های کوچک و باکیفیت برای موبایل.">
<title>بازی‌خانه | آناتومیار</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="brand/favicon.png" type="image/png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #0a0812;
    --text: #f1ecff;
    --line: rgba(255, 255, 255, .1);
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Vazirmatn, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body {
    background:
      radial-gradient(ellipse 90% 50% at 80% -10%, rgba(255, 46, 136, .18), transparent 60%),
      radial-gradient(ellipse 80% 50% at 0% 110%, rgba(110, 224, 122, .12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 760px; margin: 0 auto; padding: calc(28px + var(--st)) 16px calc(32px + var(--sb)); }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  header .brand-logo { flex: none; width: clamp(64px, 18vw, 92px); height: auto; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .5)); }
  footer .brand-mark { display: block; width: 44px; height: auto; margin: 0 auto 6px; opacity: .9; }
  h1 { margin: 0; font-size: clamp(30px, 9vw, 42px); font-weight: 900; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; opacity: .65; font-size: 15px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }

  .card {
    position: relative;
    display: block;
    overflow: hidden;
    border-radius: 24px;
    color: inherit;
    text-decoration: none;
    border: 1px solid var(--line);
    background: #120f1c;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .45);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:active { transform: scale(.98); }
  @media (hover: hover) { .card:hover { transform: translateY(-3px); box-shadow: 0 22px 50px rgba(0, 0, 0, .55); } }
  .art { display: block; width: 100%; aspect-ratio: 16 / 10; }
  .info { display: flex; align-items: center; gap: 12px; padding: 14px 16px 16px; }
  .info div { flex: 1; min-width: 0; }
  .info h2 { margin: 0; font-size: 19px; font-weight: 900; }
  .info p { margin: 2px 0 0; font-size: 13px; opacity: .65; }
  .play {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: #fff;
  }
  .speedi .play { background: linear-gradient(135deg, #ff2e88, #ff7a3d); box-shadow: 0 6px 18px rgba(255, 46, 136, .45); }
  .undead .play { background: linear-gradient(135deg, #b3232a, #6e1016); box-shadow: 0 6px 18px rgba(179, 35, 42, .45); }
  .title-speedi { font-family: Orbitron, sans-serif; font-style: italic; }
  .title-undead { font-family: Creepster, sans-serif; letter-spacing: .06em; }
  .nava .play { background: linear-gradient(135deg, #f7941d, #d4722a); box-shadow: 0 6px 18px rgba(247, 148, 29, .4); }
  .title-nava { font-size: 22px; background: linear-gradient(135deg, #f7941d, #2453a6 80%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  footer { margin-top: 26px; text-align: center; font-size: 12px; opacity: .4; }
</style>
</head>
<body>
<main>
  <header>
    <img class="brand-logo" src="brand/logo-light.webp" alt="آناتومیار — به دنیایت بیفزا" width="220" height="254">
    <div>
      <h1>بازی‌خانه</h1>
      <p>بازی‌های کوچک و سریع، ساخته‌شده برای موبایل</p>
    </div>
  </header>

  <div class="grid">
    <a class="card speedi" href="speedi/">
      <svg class="art" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05021a"/><stop offset=".6" stop-color="#3a1160"/><stop offset="1" stop-color="#9c2d6c"/></linearGradient>
          <linearGradient id="sSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff27a"/><stop offset=".5" stop-color="#ffa043"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
        </defs>
        <rect width="320" height="200" fill="url(#sSky)"/>
        <g fill="#fff" opacity=".7"><circle cx="30" cy="20" r="1"/><circle cx="90" cy="40" r=".8"/><circle cx="250" cy="25" r="1"/><circle cx="290" cy="55" r=".7"/><circle cx="180" cy="15" r=".8"/></g>
        <circle cx="160" cy="100" r="48" fill="url(#sSun)"/>
        <g fill="#3a1160"><rect x="100" y="104" width="120" height="3"/><rect x="100" y="113" width="120" height="4"/><rect x="100" y="123" width="120" height="6"/></g>
        <path d="M0 125 40 105 80 118 120 98 160 115 205 96 250 116 290 100 320 112V130H0z" fill="#34125a" stroke="#ff4fd8" stroke-width="1"/>
        <rect y="128" width="320" height="72" fill="#150b28"/>
        <path d="M150 128h20l110 72H40z" fill="#2c2842"/>
        <path d="M150 128h2L44 200h-6zM170 128h-2l110 72h6z" fill="#39f3ff"/>
        <path d="M144 128h6L36 200H22zM176 128h-6l114 72h14z" fill="#ff2e88" opacity=".85"/>
        <path d="M158.5 132h3l1 12h-5zM157 152h6l2 22h-10z" fill="#dcd4ff"/>
        <g transform="translate(160 186)">
          <ellipse cy="4" rx="34" ry="5" fill="#000" opacity=".5"/>
          <rect x="-32" y="-18" width="64" height="20" rx="6" fill="#ffc814"/>
          <path d="M-20-18l7-12h26l7 12z" fill="#b38a0c"/>
          <path d="M-15-19l5-8h20l5 8z" fill="#1c2340"/>
          <rect x="-30" y="-12" width="15" height="4" rx="2" fill="#ff2442"/>
          <rect x="15" y="-12" width="15" height="4" rx="2" fill="#ff2442"/>
          <rect x="-24" y="-3" width="48" height="5" rx="2" fill="#0a0a10"/>
        </g>
      </svg>
      <div class="info">
        <div><h2 class="title-speedi">SPEEDI</h2><p>مسابقه‌ی شبانه · از بین ماشین‌ها لایی بکش</p></div>
        <span class="play"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></span>
      </div>
    </a>

    <a class="card undead" href="zombie/">
      <svg class="art" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="zLight" cx=".35" cy=".7" r=".55"><stop offset="0" stop-color="#2c3d2a"/><stop offset=".6" stop-color="#151d16"/><stop offset="1" stop-color="#07090f"/></radialGradient>
          <radialGradient id="zMoon" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#efe6d2"/><stop offset="1" stop-color="#efe6d2" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="320" height="200" fill="url(#zLight)"/>
        <circle cx="275" cy="38" r="26" fill="url(#zMoon)"/>
        <g fill="#0d110e">
          <path d="M40 160c-2-40 4-70 0-110l6 0c-2 40 4 70 2 110z"/>
          <path d="M43 80c-12-12-22-14-30-26M44 70c14-10 20-22 24-34M42 100c-10-6-18-6-26-14" stroke="#0d110e" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <g transform="translate(250 150)">
          <ellipse cy="2" rx="16" ry="4" fill="#000" opacity=".5"/>
          <rect x="-11" y="-30" width="22" height="30" rx="3" fill="#555b69"/>
          <path d="M-9 0v-20a9 9 0 0 1 18 0V0z" fill="#6f7686"/>
          <rect x="-1" y="-26" width="2" height="9" fill="#4a4f5b"/><rect x="-4" y="-23" width="8" height="2" fill="#4a4f5b"/>
        </g>
        <g transform="translate(110 168)">
          <ellipse rx="16" ry="5" fill="#000" opacity=".45"/>

        </g>
        <path d="M140 136l60-6" stroke="#ffdc8c" stroke-width="2" stroke-linecap="round" opacity=".9"/>
        <g transform="translate(212 150) scale(-1 1)">
          <ellipse rx="14" ry="5" fill="#000" opacity=".45"/>
          <path d="M-3-18l-3 17M3-18l6 15" stroke="#33384a" stroke-width="6" stroke-linecap="round"/>
          <g transform="rotate(8 0 -18)">
            <path d="M0-35l22-2M3-33l21 4" stroke="#6f9150" stroke-width="5.5" stroke-linecap="round"/>
            <rect x="-10" y="-38" width="20" height="23" rx="7" fill="#7a4f4f"/>
            <path d="M-4-20l4-6 3 5 3-3 4 6v3h-20v-4z" fill="#6f9150"/>
            <circle cx="5" cy="-49" r="12" fill="#8fb56a"/>
            <path d="M-7-51a12 12 0 0 1 16-9l-3 5-6 1z" fill="#2e2620"/>
            <circle cx="11.6" cy="-49.6" r="2.4" fill="#ffe15a"/><circle cx="6.2" cy="-50" r="1.9" fill="#ffe15a"/>
            <path d="M5.6-43.6l9.6-1.2-1.2 5h-7z" fill="#2b0d0d"/>
          </g>
        </g>
        <g fill="#ff4630"><circle cx="276" cy="100" r="1.8"/><circle cx="282" cy="100" r="1.5"/><circle cx="20" cy="120" r="1.6"/><circle cx="26" cy="120" r="1.3"/></g>
      </svg>
      <div class="info">
        <div><h2 class="title-undead">UNDEAD</h2><p>شب زامبی‌ها · تا صبح زنده بمون</p></div>
        <span class="play"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></span>
      </div>
    </a>

    <a class="card nava" href="nava/">
      <svg class="art" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="nBg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#e4f0ff"/><stop offset="1" stop-color="#ece6ff"/></linearGradient>
          <linearGradient id="nO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb057"/><stop offset="1" stop-color="#f7731d"/></linearGradient>
          <linearGradient id="nB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#2453a6"/></linearGradient>
          <linearGradient id="nP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b28bff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
          <linearGradient id="nG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ee0a0"/><stop offset="1" stop-color="#0ea371"/></linearGradient>
        </defs>
        <rect width="320" height="200" fill="url(#nBg)"/>
        <g fill="#2453a6" opacity=".08" font-size="40" font-weight="900"><text x="30" y="60">♪</text><text x="260" y="150">♫</text><text x="140" y="190">♩</text></g>
        <g stroke="#2453a6" stroke-opacity=".12" stroke-width="1.5"><path d="M80 0v200M160 0v200M240 0v200"/></g>
        <g font-size="22" font-weight="900" fill="#fff" text-anchor="middle">

        <path d="M0 176h320" stroke="#2453a6" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round" opacity=".35"/>
      </svg>
      <div class="info">
        <div><h2 class="title-nava">نوا</h2><p>بلوک‌های موسیقی · پیانو و سنتور</p></div>
        <span class="play"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></span>
      </div>
    </a>
  </div>

  <footer><img class="brand-mark" src="brand/mark.webp" alt="" width="120" height="91">آناتومیار · بدون نصب · مستقیم در مرورگر</footer>
</main>
</body>
</html>
